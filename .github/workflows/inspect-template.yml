name: inspect-template

on:
  pull_request:
    paths:
      - ".github/workflows/inspect-template.yml"
      - "template/IILM_Survey_Paper_Template.docx"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-docx
      - name: List template paragraphs and tables
        run: |
          python - <<'PY'
          from docx import Document
          d=Document("template/IILM_Survey_Paper_Template.docx")
          print("PARAGRAPHS")
          for i,p in enumerate(d.paragraphs):
              t=" ".join(p.text.split())
              if t: print(f"P{i:03d} [{p.style.name}] {t}")
          print("TABLES")
          for ti,t in enumerate(d.tables):
              print(f"TABLE {ti} {len(t.rows)}x{len(t.columns)}")
              for ri,row in enumerate(t.rows):
                  print(f"  R{ri:02d}: " + " || ".join(" ".join(c.text.split()) for c in row.cells))
          PY
